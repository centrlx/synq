<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Аккаунт — SYNQ</title>
  <meta name="description" content="Личный кабинет SYNQ.">
  <meta name="theme-color" content="#fbfbfd">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body data-page="account">
  <main id="main" class="container">
    <header class="account-hero" id="account-hero"></header>
    <div class="account-grid">
      <div class="stack">
        <section class="panel" aria-labelledby="profile-title">
          <h2 class="panel__title" id="profile-title">Профиль</h2>
          <dl class="kv" id="profile-kv"></dl>
        </section>
        <section class="panel" aria-labelledby="edit-title">
          <h2 class="panel__title" id="edit-title">Настройки</h2>
          <form class="stack" id="profile-form" novalidate>
            <div class="form-alert" role="alert" hidden></div>
            <div class="field">
              <label class="field__label" for="p-name">Имя</label>
              <input class="input" id="p-name" name="name" type="text" minlength="2" maxlength="80" autocomplete="name">
              <span class="field__error"></span>
            </div>
            <div class="field">
              <label class="field__label" for="p-current">Текущий пароль</label>
              <input class="input" id="p-current" name="currentPassword" type="password" autocomplete="current-password" maxlength="72">
              <span class="field__error"></span>
            </div>
            <div class="field">
              <label class="field__label" for="p-new">Новый пароль</label>
              <input class="input" id="p-new" name="newPassword" type="password" autocomplete="new-password" maxlength="72">
              <span class="field__hint">Оставьте пустым, чтобы не менять.</span>
              <span class="field__error"></span>
            </div>
            <button class="btn" type="submit">Сохранить</button>
          </form>
        </section>
      </div>
      <section class="panel" aria-labelledby="orders-title">
        <div class="panel__head">
          <h2 class="panel__title" id="orders-title">Последние заказы</h2>
          <a class="link-arrow" href="/orders">Все заказы</a>
        </div>
        <div id="recent-orders"></div>
      </section>
    </div>
  </main>
  <script type="module" src="/js/orders.js"></script>
</body>
</html>
