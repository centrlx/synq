<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мои заказы — SYNQ</title>
  <meta name="description" content="Заказы и загрузки SYNQ.">
  <meta name="theme-color" content="#fbfbfd">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body data-page="orders">
  <main id="main" class="container">
    <header class="page-head catalog-head">
      <div>
        <h1>Мои заказы</h1>
        <p>Статусы оплаты и доступные загрузки.</p>
      </div>
      <div class="segmented" id="status-filter" role="group" aria-label="Фильтр по статусу">
        <button type="button" data-status="" aria-pressed="true">Все</button>
        <button type="button" data-status="PAID" aria-pressed="false">Оплаченные</button>
        <button type="button" data-status="PENDING" aria-pressed="false">Ожидают</button>
        <button type="button" data-status="CANCELLED" aria-pressed="false">Отменённые</button>
      </div>
    </header>
    <section class="panel">
      <div id="orders-list"></div>
    </section>
    <div id="pager"></div>
  </main>
  <script type="module" src="/js/orders.js"></script>
</body>
</html>
