<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Каталог — SYNQ</title>
  <meta name="description" content="Каталог VST-плагинов, DAW и подписок: поиск, фильтры и сортировка.">
  <meta name="theme-color" content="#fbfbfd">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..800&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body data-page="catalog">
  <main id="main" class="container">
    <header class="page-head catalog-head">
      <div>
        <h1>Каталог</h1>
        <p id="catalog-sub">VST-плагины, DAW и подписки для музыкантов.</p>
      </div>
      <span class="catalog-count" id="catalog-count" aria-live="polite"></span>
    </header>

    <div class="toolbar" id="toolbar">
      <form class="toolbar__row" id="filters" role="search">
        <label class="search">
          <span class="visually-hidden">Поиск</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" type="search" name="search" id="search" placeholder="Название или разработчик" autocomplete="off" maxlength="100">
        </label>
        <div class="toolbar__filters">
          <label>
            <span class="visually-hidden">Платформа</span>
            <select class="select" name="platform">
              <option value="">Все платформы</option>
              <option value="macOS">macOS</option>
              <option value="Windows">Windows</option>
              <option value="Linux">Linux</option>
            </select>
          </label>
          <label>
            <span class="visually-hidden">Сортировка</span>
            <select class="select" name="sort">
              <option value="newest">Сначала новые</option>
              <option value="oldest">Сначала старые</option>
              <option value="price_asc">Дешевле</option>
              <option value="price_desc">Дороже</option>
              <option value="name_asc">По названию А–Я</option>
              <option value="name_desc">По названию Я–А</option>
            </select>
          </label>
          <button class="chip toolbar__sale" id="sale-toggle" type="button" aria-pressed="false">Со скидкой</button>
        </div>
        <div class="chips" id="category-chips" role="group" aria-label="Категория"></div>
      </form>
    </div>

    <div id="results" class="product-grid" aria-live="polite"></div>
    <div id="pager"></div>
  </main>
  <script type="module" src="/js/products.js"></script>
</body>
</html>
