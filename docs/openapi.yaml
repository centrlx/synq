openapi: 3.0.3
info:
  title: SYNQ REST API
  version: 1.0.0
  description: |
    REST API интернет-магазина цифровых товаров для музыкального производства.
    Все ответы имеют формат `{ success, data, meta? }` или `{ success: false, error: { code, message, details? } }`.
servers:
  - url: http://localhost:4000/api
tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Products
  - name: Orders
  - name: Reviews
  - name: Uploads
  - name: Service

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    Meta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Role:
      type: string
      enum: [USER, ADMIN]
    OrderStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
    CategoryBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryBrief'
        - type: object
          properties:
            description: { type: string, nullable: true }
            productsCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        price: { type: string, example: '49.90' }
        developer: { type: string, nullable: true }
        version: { type: string, nullable: true }
        formats: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string, enum: [macOS, Windows, Linux] } }
        stock: { type: integer, nullable: true, description: 'Остаток лицензий; null — без ограничений' }
        salePrice: { type: string, nullable: true, example: '7499.00', description: 'Цена со скидкой (покупателю — только пока скидка действует)' }
        saleEndsAt: { type: string, format: date-time, nullable: true }
        onSale: { type: boolean }
        finalPrice: { type: string, example: '7499.00', description: 'Действующая цена с учётом скидки' }
        discountPercent: { type: integer, example: 25 }
        imageUrl: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        fileSize: { type: integer, nullable: true }
        hasFile: { type: boolean }
        isActive: { type: boolean }
        categoryId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/CategoryBrief' }
        filePath: { type: string, nullable: true, description: 'Только для ADMIN' }
        imagePath: { type: string, nullable: true, description: 'Только для ADMIN' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      additionalProperties: false
      required: [name, description, price, categoryId]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, minLength: 10, maxLength: 5000 }
        price: { oneOf: [{ type: number, minimum: 0 }, { type: string, example: '49.90' }] }
        categoryId: { type: string, format: uuid }
        developer: { type: string, nullable: true, maxLength: 80 }
        version: { type: string, nullable: true, maxLength: 30 }
        formats: { type: array, maxItems: 10, items: { type: string, maxLength: 20 } }
        platforms: { type: array, items: { type: string, enum: [macOS, Windows, Linux] } }
        stock: { type: integer, minimum: 0, nullable: true }
        isActive: { type: boolean }
        salePrice: { oneOf: [{ type: number }, { type: string }], nullable: true, description: 'Меньше price; null — снять скидку' }
        saleEndsAt: { type: string, format: date-time, nullable: true }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        priceAtPurchase: { type: string, example: '49.90' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        product: { $ref: '#/components/schemas/Product' }
        user:
          type: object
          description: Только в ответах для ADMIN
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string }

  responses:
    BadRequest:
      description: Ошибка валидации
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Нет или недействителен JWT
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Недостаточно прав
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Не найдено
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Конфликт данных
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    StorageUnavailable:
      description: Supabase Storage не настроен
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация (роль всегда USER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name, password]
              properties:
                email: { type: string, format: email }
                name: { type: string, minLength: 2, maxLength: 80 }
                password: { type: string, minLength: 8, maxLength: 72, description: 'Буква и цифра обязательны' }
      responses:
        '201':
          description: Пользователь создан
          content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/AuthResult' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Превышен лимит попыток }

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход и получение JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Успешный вход
          content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/AuthResult' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Превышен лимит попыток }

  /auth/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Профиль, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Users]
      summary: Список пользователей (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
      responses:
        '200': { description: Список, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { type: array, items: { $ref: '#/components/schemas/User' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/me:
    patch:
      tags: [Users]
      summary: Изменить своё имя или пароль
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200': { description: Обновлённый профиль }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Профиль пользователя с последними заказами (свой или ADMIN)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Профиль }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Назначить роль (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/Role' } } } } }
      responses:
        '200': { description: Роль изменена }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories:
    get:
      tags: [Categories]
      summary: Все категории
      responses:
        '200': { description: Список, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
    post:
      tags: [Categories]
      summary: Создать категорию (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string, nullable: true }
      responses:
        '201': { description: Создано }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Categories]
      summary: Категория по ID
      responses:
        '200': { description: Категория }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Categories]
      summary: Изменить категорию (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, slug: { type: string }, description: { type: string, nullable: true } } } } }
      responses:
        '200': { description: Обновлено }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Categories]
      summary: Удалить пустую категорию (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories/{id}/products:
    get:
      tags: [Categories]
      summary: Категория и её товары (Prisma include)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Категория и товары
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      category: { $ref: '#/components/schemas/Category' }
                      items: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products:
    get:
      tags: [Products]
      summary: Каталог с поиском, фильтрами, сортировкой и пагинацией
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, description: UUID или slug, schema: { type: string } }
        - { name: platform, in: query, schema: { type: string, enum: [macOS, Windows, Linux] } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, price_asc, price_desc, name_asc, name_desc], default: newest } }
        - { name: status, in: query, description: 'archived/all — только ADMIN', schema: { type: string, enum: [active, archived, all], default: active } }
        - { name: onSale, in: query, description: 'Только товары с действующей скидкой', schema: { type: string, enum: ['true'] } }
        - { name: developer, in: query, description: 'Бренд (разработчик), без учёта регистра', schema: { type: string } }
      responses:
        '200': { description: Список, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { type: array, items: { $ref: '#/components/schemas/Product' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Products]
      summary: Создать товар (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/Product' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/discounts:
    post:
      tags: [Products]
      summary: Массовая скидка в процентах (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [percent]
              properties:
                percent: { type: integer, minimum: 1, maximum: 95 }
                categoryId: { type: string, format: uuid, nullable: true }
                endsAt: { type: string, format: date-time, nullable: true }
      responses:
        '200': { description: 'Число товаров со скидкой: { updated, skipped }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Снять скидки с категории или каталога (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '{ cleared }' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Products]
      summary: Товар по ID
      responses:
        '200': { description: Товар, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/Product' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Изменить товар (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '200': { description: Обновлено }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Products]
      summary: Удалить товар или перенести в архив, если есть заказы (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      deleted: { type: boolean }
                      archived: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    post:
      tags: [Orders]
      summary: Оформить заказ (владелец — из JWT)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productId]
              properties:
                productId: { type: string, format: uuid }
      responses:
        '201': { description: Заказ создан, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/Order' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Orders]
      summary: Все заказы (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Список, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { type: array, items: { $ref: '#/components/schemas/Order' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/my:
    get:
      tags: [Orders]
      summary: Мои заказы
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200': { description: Список, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { type: array, items: { $ref: '#/components/schemas/Order' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Заказ по ID (владелец или ADMIN)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Заказ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Сменить статус (ADMIN; покупатель — только отмена своего PENDING)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/OrderStatus' } } } } }
      responses:
        '200': { description: Обновлено }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{id}/pay:
    post:
      tags: [Orders]
      summary: Оплата заказа картой (передаются только платёжная система и последние 4 цифры)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cardBrand, cardLast4]
              properties:
                cardBrand: { type: string, enum: [visa, mastercard, mir, amex, unionpay, card] }
                cardLast4: { type: string, pattern: '^\\d{4}$' }
      responses:
        '200': { description: 'Заказ оплачен (status PAID, paymentRef, paidAt)' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Банк отклонил платёж }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{id}/download:
    get:
      tags: [Orders]
      summary: Подписанная ссылка на файл оплаченного заказа
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Ссылка
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      url: { type: string }
                      expiresIn: { type: integer, example: 120 }
                      fileName: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /uploads/product-image:
    post:
      tags: [Uploads]
      summary: Загрузить/заменить обложку товара (ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [productId, file]
              properties:
                productId: { type: string, format: uuid }
                file: { type: string, format: binary, description: 'JPG/PNG/WEBP ≤ 5 МБ' }
      responses:
        '201': { description: Товар с новым imageUrl }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Файл слишком большой }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /uploads/product-file:
    post:
      tags: [Uploads]
      summary: Загрузить/заменить цифровой файл товара (ADMIN, приватный бакет)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [productId, file]
              properties:
                productId: { type: string, format: uuid }
                file: { type: string, format: binary, description: '≤ 50 МБ' }
      responses:
        '201': { description: Товар с hasFile=true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Файл слишком большой }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /uploads/product-image/{productId}:
    delete:
      tags: [Uploads]
      summary: Удалить обложку товара (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /uploads/product-file/{productId}:
    delete:
      tags: [Uploads]
      summary: Удалить цифровой файл товара (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /products/popular:
    get:
      tags: [Products]
      summary: Самое популярное (покупки × 20 + просмотры)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 8 } }
      responses:
        '200': { description: 'Товары с salesCount, ratingAvg, reviewsCount' }

  /products/{id}/view:
    post:
      tags: [Products]
      summary: Учёт просмотра страницы товара
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Просмотр учтён }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}/reviews:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Reviews]
      summary: Отзывы товара и сводка рейтинга
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, best, worst] } }
      responses:
        '200': { description: 'items, summary { average, count, distribution }' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Reviews]
      summary: Оставить отзыв (только после оплаченного заказа)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rating, text]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201': { description: Отзыв создан }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{id}/reviews/me:
    get:
      tags: [Reviews]
      summary: Может ли пользователь оставить отзыв
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: '{ purchased, canReview, review }' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reviews:
    get:
      tags: [Reviews]
      summary: Лента всех отзывов со сводкой
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, best, worst] } }
      responses:
        '200': { description: 'items, summary' }

  /reviews/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Reviews]
      summary: Изменить свой отзыв
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { rating: { type: integer }, text: { type: string } } } } }
      responses:
        '200': { description: Обновлено }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reviews]
      summary: Удалить отзыв (автор или администратор)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Удалено }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /brands:
    get:
      tags: [Products]
      summary: Бренды (разработчики) с количеством товаров
      responses:
        '200':
          description: Список брендов
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        productsCount: { type: integer }
                        images: { type: array, items: { type: string } }

  /stats:
    get:
      tags: [Service]
      summary: Реальная статистика магазина (ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Агрегаты PostgreSQL }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /health:
    get:
      tags: [Service]
      summary: Состояние API, БД и хранилища
      responses:
        '200': { description: OK }
